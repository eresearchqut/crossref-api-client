name: build
on:
  pull_request:
  push:
jobs:
  build:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Dependencies
        run: npm ci
      - name: Build
        env:
          CROSSREF_SPEC_URL: ${{ vars.CROSSREF_SPEC_URL }}
        run: npm run build
      - name: Test
        run: npm test
  publish-node:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on:
      - ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # for npm trusted publishing and provenance
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing to npm uses trusted publishing (OIDC). NPM_TOKEN is only a fallback for when no trusted publisher is configured, such as the package's first release.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Dependencies
        run: npm ci
      - name: Build
        env:
          CROSSREF_SPEC_URL: ${{ vars.CROSSREF_SPEC_URL }}
        run: npm run build
      - name: Test
        run: npm test
      - name: Release
        run: npx semantic-release
        id: release
