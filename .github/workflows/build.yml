name: build
on:
  pull_request:
  push:
jobs:
  build:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Dependencies
        run: npm ci
      - name: Build
        env:
          CROSSREF_SPEC_URL: ${{ vars.CROSSREF_SPEC_URL }}
        run: npm run build
      - name: Test
        run: npm test
  publish-node:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on:
      - ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # for npm trusted publishing and provenance
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Dependencies
        run: npm ci
      - name: Build
        env:
          CROSSREF_SPEC_URL: ${{ vars.CROSSREF_SPEC_URL }}
        run: npm run build
      - name: Test
        run: npm test
      - name: Release
        run: npx semantic-release
        id: release
      # @semantic-release/npm leaves the tarball it published to npm in release/
      # (its tarballDir option), so GitHub Packages gets the identical package
      # rather than a rebuild against a possibly newer Crossref spec.
      - name: Check for a new release
        id: tarball
        run: |
          if compgen -G "release/*.tgz" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the release tarball
        if: steps.tarball.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: release/*.tgz
          if-no-files-found: error
    outputs:
      released: ${{ steps.tarball.outputs.released }}
  # A `release: created` workflow (as in jest-testcontainers) would never run
  # here, because events raised with GITHUB_TOKEN do not trigger workflows.
  publish-gpr:
    needs: publish-node
    if: needs.publish-node.outputs.released == 'true'
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: "@eresearchqut"
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: release
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish release/*.tgz
